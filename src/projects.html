<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster — 404</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="page">
    <header class="site-header">
        <a href="index.html" class="logo" aria-label="TaskMaster">
            <svg class="logo-img" viewBox="0 0 64 64" aria-hidden="true">
                <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#7B00FF"/><stop offset="1" stop-color="#C86BFF"/>
                </linearGradient></defs>
                <rect width="64" height="64" rx="16" fill="url(#lg)"/>
                <rect x="14" y="12" width="36" height="40" rx="7" fill="#fff"/>
                <rect x="20" y="20" width="16" height="4" rx="2" fill="#7B00FF"/>
                <rect x="20" y="29" width="24" height="4" rx="2" fill="#D9C2FF"/>
                <rect x="20" y="38" width="20" height="4" rx="2" fill="#D9C2FF"/>
                <circle cx="45" cy="45" r="13" fill="#FFD700" stroke="#fff" stroke-width="2"/>
                <path d="M39.5 45.5 l4 4 l7 -8" fill="none" stroke="#7B00FF" stroke-width="3.5"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>TaskMaster</span>
        </a>

        <nav class="nav" id="nav">
            <a href="index.html" class="nav-link">Главная</a>
            <a href="projects.html" class="nav-link active" aria-current="page">Проекты</a>
            <a href="tasks.html" class="nav-link">Список задач</a>
            <a href="about.html" class="nav-link">О приложении</a>
        </nav>

        <button class="burger" id="burger" aria-label="Меню" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
    </header>
    <div class="overlay" id="overlay"></div>

    <main class="error-page">
        <h1 class="error-code">404</h1>
        <p class="error-text">Страница «Проекты» находится в разработке</p>
        <svg class="error-img" viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg" aria-label="404">
            <rect x="40" y="40" width="340" height="220" rx="16" fill="#fff" stroke="#9400D3" stroke-width="6"/>
            <rect x="40" y="40" width="340" height="46" rx="16" fill="#9400D3"/>
            <circle cx="70"  cy="63" r="8" fill="#FFD700"/>
            <circle cx="95"  cy="63" r="8" fill="#FF6347"/>
            <circle cx="120" cy="63" r="8" fill="#32CD32"/>
            <circle cx="165" cy="150" r="14" fill="#9400D3"/>
            <circle cx="255" cy="150" r="14" fill="#9400D3"/>
            <path d="M160 210 Q210 170 260 210" stroke="#9400D3" stroke-width="10" fill="none" stroke-linecap="round"/>
        </svg>
        <a href="index.html" class="add-btn" style="margin-top:20px; display:inline-block; text-decoration:none;">На главную</a>
    </main>

    <script src="bundle.js"></script>
</body>
</html>
