<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster — Список задач</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="page">
    <header class="site-header">
        <a href="index.html" class="logo" aria-label="TaskMaster">
            <svg class="logo-img" viewBox="0 0 64 64" aria-hidden="true">
                <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#7B00FF"/><stop offset="1" stop-color="#C86BFF"/>
                </linearGradient></defs>
                <rect width="64" height="64" rx="16" fill="url(#lg)"/>
                <rect x="14" y="12" width="36" height="40" rx="7" fill="#fff"/>
                <rect x="20" y="20" width="16" height="4" rx="2" fill="#7B00FF"/>
                <rect x="20" y="29" width="24" height="4" rx="2" fill="#D9C2FF"/>
                <rect x="20" y="38" width="20" height="4" rx="2" fill="#D9C2FF"/>
                <circle cx="45" cy="45" r="13" fill="#FFD700" stroke="#fff" stroke-width="2"/>
                <path d="M39.5 45.5 l4 4 l7 -8" fill="none" stroke="#7B00FF" stroke-width="3.5"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>TaskMaster</span>
        </a>

        <nav class="nav" id="nav">
            <a href="index.html" class="nav-link">Главная</a>
            <a href="projects.html" class="nav-link">Проекты</a>
            <a href="tasks.html" class="nav-link active" aria-current="page">Список задач</a>
            <a href="about.html" class="nav-link">О приложении</a>
        </nav>

        <button class="burger" id="burger" aria-label="Меню" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
    </header>
    <div class="overlay" id="overlay"></div>

    <main class="content">
        <h1 class="title">Список задач</h1>
        <div class="center-box">
            <button class="add-btn" data-add-task>+ Добавить задачу</button>
            <button class="sort-btn" data-sort="asc">Сортировка А→Я</button>
            <button class="sort-btn" data-sort="desc">Сортировка Я→А</button>
        </div>

        <div class="task-table">
            <div class="task-column">
                <h2 class="column-title">Задачи</h2>
                <div class="cards" data-column="todo"></div>
            </div>
            <div class="task-column">
                <h2 class="column-title">В работе</h2>
                <div class="cards" data-column="work"></div>
            </div>
            <div class="task-column">
                <h2 class="column-title">Выполненные</h2>
                <div class="cards" data-column="done"></div>
            </div>
        </div>

        <dialog data-task-dialog>
            <form data-task-form class="form">
                <h2>Новая задача</h2>
                <input type="text" name="taskText" class="input" placeholder="Текст задачи" required>
                <div class="dialog-buttons">
                    <button type="button" class="del-btn" onclick="this.closest('dialog').close()">Отмена</button>
                    <button type="submit" class="add-btn">Добавить</button>
                </div>
            </form>
        </dialog>
    </main>

    <script src="bundle.js"></script>
</body>
</html>
